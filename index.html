<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#160f16">
<title>Prince of the Dunes — The Sunstone</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Marcellus&display=swap');
:root{color-scheme:dark;--gold:#edbd69;--sand:#d89a53;--ink:#1a1117;--muted:#a89383}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 5%,#35242c 0,#1b141a 53%,#100c11 100%);color:#f3e7d4;font-family:'DM Mono',monospace;display:grid;place-items:center;overflow:hidden}
.shell{width:min(1120px,100vw);padding:18px 24px 14px}.top{display:flex;align-items:end;justify-content:space-between;margin:0 2px 12px}.brand{display:flex;gap:12px;align-items:center}.brandmark{font-size:29px;color:var(--gold);line-height:1;text-shadow:0 0 18px #edbd6960}.brand h1{font:20px 'Marcellus',serif;letter-spacing:2px;margin:0;color:#f5e3c2}.brand p{margin:4px 0 0;font-size:9px;letter-spacing:2.4px;color:#a8927a}.chapter{font-size:10px;letter-spacing:2px;color:#c5a77e;text-transform:uppercase}.frame{position:relative;border:1px solid #8e694755;padding:5px;background:#1a1119;box-shadow:0 18px 70px #0009,0 0 0 1px #e6b96114;overflow:hidden}.frame:before,.frame:after{content:'';position:absolute;z-index:2;pointer-events:none;width:24px;height:24px;border-color:#e6b961;opacity:.7}.frame:before{left:0;top:0;border-left:1px solid;border-top:1px solid}.frame:after{right:0;bottom:0;border-right:1px solid;border-bottom:1px solid}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:pixelated;background:#20161a;touch-action:none}.bottom{display:flex;justify-content:space-between;align-items:center;padding:11px 3px 0;color:#907e6d;font-size:9px;letter-spacing:.5px}.keys{display:flex;gap:13px}.key{color:#d8b778;border:1px solid #765a3c;padding:3px 6px;margin-right:4px;font-size:9px}.note{color:#aa9278}.mobile{display:none;position:absolute;inset:auto 12px 12px;justify-content:space-between;pointer-events:none;z-index:3}.pad,.actions{display:flex;gap:8px;pointer-events:auto}.mobile button{width:44px;height:44px;border:1px solid #edbd6970;border-radius:50%;background:#170f19aa;color:#f4d59e;font:18px 'DM Mono';touch-action:none;user-select:none}.mobile button:active{background:#b97836aa}.mobile .wide{width:52px;height:52px}.modalhint{color:#f1d7a7}
@media(max-width:700px){body{display:block;overflow:hidden}.shell{width:100%;padding:10px 0}.top{padding:0 13px;margin-bottom:8px}.brand h1{font-size:16px}.brand p{font-size:8px}.chapter{font-size:8px}.frame{padding:2px;border-left:0;border-right:0}.bottom{padding:8px 12px;font-size:8px}.keys{display:none}.mobile{display:flex}.mobile button{opacity:.82}.frame:before,.frame:after{display:none}}
@media(max-height:500px) and (orientation:landscape){.shell{padding:4px 0;width:min(110vh,100vw)}.top,.bottom{display:none}.frame{padding:2px}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="brand"><div class="brandmark">𓋹</div><div><h1>PRINCE OF THE DUNES</h1><p>THE SUNSTONE PROPHECY</p></div></div><div class="chapter">CHAPTER I &nbsp;·&nbsp; THE BURIED KINGDOM</div></header>
<div class="frame"><canvas id="game" width="960" height="540" aria-label="Prince of the Dunes platform adventure"></canvas>
<div class="mobile" aria-label="Touch controls"><div class="pad"><button data-key="left">◀</button><button data-key="right">▶</button></div><div class="actions"><button data-key="jump">▲</button><button data-key="attack">⚔</button><button data-key="magic" class="wide">✦</button></div></div>
</div>
<footer class="bottom"><div class="keys"><span><b class="key">A D</b> MOVE</span><span><b class="key">SPACE</b> JUMP</span><span><b class="key">J</b> STRIKE</span><span><b class="key">K</b> SPELL</span><span><b class="key">E</b> OPEN / UPGRADE</span></div><div class="note">A PIXEL-ART TALE OF THE ANCIENT SANDS</div></footer>
</main>
<script src="game.js"></script>
</body>
</html>
