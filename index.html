<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#171321"><title>Prince of the Sunken Pyramid</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Marcellus&display=swap');
:root{--gold:#f2c56b;--sand:#d79554;--ink:#171321;--panel:#211c2b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15121b;color:#f8e9c9;font-family:'DM Mono',monospace}body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#423044 0,#17131e 70%)}
#frame{position:relative;width:min(100vw, calc(100vh * 16 / 9));aspect-ratio:16/9;max-height:100vh;overflow:hidden;background:#251c2c;box-shadow:0 20px 90px #07060caa;border:1px solid #c18b5940}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
#toast{position:absolute;left:50%;top:19%;transform:translate(-50%,-10px);opacity:0;pointer-events:none;background:#171321e8;border:1px solid #e1ae5b;padding:9px 16px;color:#ffe4a5;font-size:12px;letter-spacing:.08em;transition:.25s;white-space:nowrap;z-index:4}#toast.show{opacity:1;transform:translate(-50%,0)}
#touch{display:none;position:absolute;inset:auto 0 12px;padding:0 14px;justify-content:space-between;align-items:end;pointer-events:none;z-index:3}.cluster{display:flex;gap:7px;align-items:end}.touchbtn{pointer-events:auto;width:48px;height:48px;border-radius:13px;border:1px solid #f4cf8b88;background:#171321aa;color:#ffe5b0;font:500 16px 'DM Mono';display:grid;place-items:center;backdrop-filter:blur(4px);touch-action:none;user-select:none}.touchbtn.big{width:56px;height:56px;border-radius:50%}.touchbtn:active{background:#b97b3cbb;transform:scale(.94)}
@media (pointer:coarse){#touch{display:flex} }
</style>
</head>
<body><main id="frame"><canvas id="game" width="960" height="540" aria-label="Prince of the Sunken Pyramid game"></canvas><div id="toast"></div><div id="touch"><div class="cluster"><button class="touchbtn" data-key="left">◀</button><button class="touchbtn" data-key="right">▶</button><button class="touchbtn big" data-key="jump">↑</button></div><div class="cluster"><button class="touchbtn" data-key="interact">E</button><button class="touchbtn" data-key="magic">✦</button><button class="touchbtn big" data-key="attack">⚔</button></div></div></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=960,H=540;
ctx.imageSmoothingEnabled=false;
const keys={};let gameState='title',last=0,tick=0,cam=0,toastTimer=0,shake=0;
const worldEnd=4650,ground=438;
const floorAt=x=>x>2140?470:ground;
const player={x:100,y:ground-42,w:28,h:42,vx:0,vy:0,face:1,hp:100,maxHp:100,mp:70,maxMp:70,xp:0,level:1,next:100,str:12,magic:16,speed:3.1,weapon:'Khopesh',weaponLevel:1,attackCd:0,magicCd:0,invuln:0,onGround:false,anim:0};
let enemies=[],chests=[],particles=[],projectiles=[],boss=null,gem=null,opened=0,upgradeOpen=false,worldTime=0;
const platforms=[{x:520,y:350,w:130},{x:790,y:305,w:135},{x:1085,y:360,w:160},{x:1350,y:300,w:120},{x:1650,y:350,w:150},{x:1970,y:310,w:150},{x:2300,y:360,w:165},{x:2600,y:310,w:150},{x:2900,y:360,w:150},{x:3210,y:305,w:170},{x:3510,y:355,w:145},{x:3810,y:310,w:180},{x:4120,y:355,w:160}];
function spawnEnemy(x,type='mummy'){enemies.push({x,y:floorAt(x)-39,w:type==='scorpion'?34:27,h:type==='scorpion'?25:39,hp:type==='scorpion'?45:42,max:type==='scorpion'?45:42,type,dir:Math.random()<.5?-1:1,cd:0,alive:true,anim:Math.random()*5});}
[430,740,1020,1240,1510,1810,2100,2440,2770,3060,3370,3680,3960,4230].forEach((x,i)=>spawnEnemy(x,i%4===2?'scorpion':'mummy'));
chests=[{x:660,opened:false,loot:'weapon'},{x:1470,opened:false,loot:'heart'},{x:2380,opened:false,loot:'spell'},{x:3300,opened:false,loot:'weapon'}];
function setToast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');toastTimer=2.1}
function startGame(){gameState='playing';setToast('THE SUNKEN PYRAMID AWAITS');last=performance.now();}
function upgrade(n){if(!upgradeOpen)return;upgradeOpen=false;switch(n){case 1:player.str+=5;setToast('STRENGTH +5  ·  HEAVIER STRIKES');break;case 2:player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+35);setToast('VITALITY +25  ·  HEALTH RESTORED');break;case 3:player.magic+=7;player.maxMp+=15;player.mp=Math.min(player.maxMp,player.mp+20);setToast('ARCANA +7  ·  MANA RESERVE +15');break;case 4:player.speed=Math.min(5.2,player.speed+.35);setToast('SWIFTNESS +  ·  FASTER MOVEMENT');break}}
function gainXP(n){player.xp+=n;if(player.xp>=player.next){player.xp-=player.next;player.level++;player.next=Math.floor(player.next*1.35);player.hp=Math.min(player.maxHp,player.hp+20);upgradeOpen=true;setToast('LEVEL UP! CHOOSE AN UPGRADE');}}
function addParticles(x,y,color,count=9){for(let i=0;i<count;i++)particles.push({x,y,vx:(Math.random()-.5)*4,vy:(Math.random()-.7)*4,life:.4+Math.random()*.5,color,size:2+Math.random()*3})}
function damagePlayer(d){if(player.invuln>0||gameState!=='playing')return;player.hp-=d;player.invuln=1.05;shake=6;addParticles(player.x+14,player.y+20,'#ed7964',8);if(player.hp<=0){player.hp=0;gameState='dead'}}
function attack(){if(player.attackCd>0||upgradeOpen||gameState!=='playing')return;player.attackCd=.34;const range=player.weapon==='Sunforged Blade'?70:58;let hit=false;for(const e of enemies){if(!e.alive)continue;const dx=e.x-player.x;if(Math.abs(dx)<range&&Math.abs((e.y+e.h/2)-(player.y+player.h/2))<55&&(dx===0||Math.sign(dx)===player.face)){e.hp-=player.str+(player.weaponLevel-1)*6;hit=true;addParticles(e.x+e.w/2,e.y+18,'#f1cb73',7);if(e.hp<=0){e.alive=false;gainXP(e.type==='scorpion'?38:30);if(Math.random()<.45)player.mp=Math.min(player.maxMp,player.mp+12)}}}if(boss&&boss.alive&&Math.abs(boss.x-player.x)<90&&Math.sign(boss.x-player.x)===player.face){boss.hp-=player.str+(player.weaponLevel-1)*6;hit=true;addParticles(boss.x+boss.w/2,boss.y+30,'#f6b95e',12);if(boss.hp<=0)defeatBoss()}if(hit)shake=3}
function castMagic(){if(player.magicCd>0||player.mp<18||upgradeOpen||gameState!=='playing')return;player.mp-=18;player.magicCd=.65;projectiles.push({x:player.x+player.w/2+player.face*18,y:player.y+18,vx:player.face*7,life:1.6,damage:player.magic+player.level*2});addParticles(player.x+14,player.y+17,'#85e8df',6)}
function defeatBoss(){boss.alive=false;gainXP(120);player.weapon='Sunforged Blade';player.weaponLevel=3;player.maxMp+=30;player.mp=player.maxMp;gem={x:boss.x+25,y:ground-50,got:false};setToast('THE WARDEN FALLS — THE SUNFORGED BLADE IS YOURS!');}
function interact(){if(gameState==='title'){startGame();return}if(gameState==='dead'||gameState==='won'){resetGame();return}if(upgradeOpen)return;let c=chests.find(c=>!c.opened&&Math.abs(c.x-player.x)<65);if(c){c.opened=true;opened++;addParticles(c.x+16,ground-30,'#f3cc76',18);if(c.loot==='weapon'){player.weaponLevel++;player.weapon=player.weaponLevel>2?'Royal Khopesh':'Khopesh +';player.str+=4;setToast('CHEST FOUND: '+player.weapon.toUpperCase()+'  ·  STRENGTH +4')}else if(c.loot==='heart'){player.maxHp+=30;player.hp=player.maxHp;setToast('CHEST FOUND: HEART OF OSIRIS  ·  MAX HEALTH +30')}else{player.maxMp+=25;player.mp=player.maxMp;player.magic+=8;setToast('CHEST FOUND: SCARAB OF FLAME  ·  MAGIC +8')}return}if(gem&&!gem.got&&Math.abs(gem.x-player.x)<75){gem.got=true;gameState='won';return}if(boss&&!boss.alive&&!gem){setToast('A GEMSTONE SHIMMERS IN THE WARDEN’S REMAINS');return}if(Math.abs(player.x-4400)<170&&(!boss||!boss.alive)){setToast('THE SUN GEM IS NEAR — PRESS E TO CLAIM IT');return}setToast('NOTHING TO INTERACT WITH HERE')}
function resetGame(){player.x=100;player.y=ground-42;player.vx=player.vy=0;player.hp=player.maxHp;player.mp=player.maxMp;player.xp=0;player.level=1;player.next=100;player.str=12;player.magic=16;player.speed=3.1;player.weapon='Khopesh';player.weaponLevel=1;player.invuln=0;enemies=[];[430,740,1020,1240,1510,1810,2100,2440,2770,3060,3370,3680,3960,4230].forEach((x,i)=>spawnEnemy(x,i%4===2?'scorpion':'mummy'));chests.forEach(c=>c.opened=false);boss=null;gem=null;projectiles=[];particles=[];opened=0;gameState='playing';}
function update(dt){tick+=dt;worldTime+=dt;if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)document.getElementById('toast').classList.remove('show')}if(shake>0)shake=Math.max(0,shake-dt*18);if(gameState!=='playing'||upgradeOpen)return;
player.anim+=dt*10;player.attackCd=Math.max(0,player.attackCd-dt);player.magicCd=Math.max(0,player.magicCd-dt);player.invuln=Math.max(0,player.invuln-dt);
const left=keys.left||keys.a,right=keys.right||keys.d;player.vx=left?-player.speed:right?player.speed:0;if(left)player.face=-1;if(right)player.face=1;if((keys.jump||keys.w||keys.up)&&player.onGround){player.vy=-10.7;player.onGround=false;keys.jump=keys.w=keys.up=false}
player.x=Math.max(0,Math.min(worldEnd-100,player.x+player.vx));player.vy=Math.min(13,player.vy+.48);player.y+=player.vy;let floor=player.x>2140?470:ground;player.onGround=false;
if(player.y+player.h>=floor){player.y=floor-player.h;player.vy=0;player.onGround=true}
for(const p of platforms){if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h-player.vy<=p.y){player.y=p.y-player.h;player.vy=0;player.onGround=true}}
if(player.x>4390&&boss&&boss.alive)player.x=4390;
for(const e of enemies){if(!e.alive)continue;e.anim+=dt*6;e.cd=Math.max(0,e.cd-dt);let dx=player.x-e.x;if(Math.abs(dx)<300){e.dir=Math.sign(dx)||e.dir;e.x+=e.dir*(e.type==='scorpion'?35:25)*dt}if(Math.abs(dx)<38&&Math.abs(player.y-e.y)<55&&e.cd<=0){damagePlayer(e.type==='scorpion'?13:10);e.cd=1.1}e.x=Math.max(0,Math.min(worldEnd-150,e.x))}
if(player.x>4320&&!boss){boss={x:4410,y:floorAt(4410)-70,w:58,h:70,hp:280,max:280,alive:true,cd:0,anim:0};setToast('BOSS: ANUBIS, PYRAMID WARDEN')}
if(boss&&boss.alive){boss.cd-=dt;boss.anim+=dt*4;if(Math.abs(player.x-boss.x)<120&&boss.cd<=0){damagePlayer(18);boss.cd=1.3}else if(Math.abs(player.x-boss.x)>70)boss.x+=Math.sign(player.x-boss.x)*18*dt}
for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.x+=p.vx;p.life-=dt;let hit=false;for(const e of enemies){if(e.alive&&Math.abs(p.x-e.x)<22&&Math.abs(p.y-(e.y+18))<25){e.hp-=p.damage;hit=true;addParticles(e.x+12,e.y+15,'#7de6d9',10);if(e.hp<=0){e.alive=false;gainXP(e.type==='scorpion'?38:30)}}}if(boss&&boss.alive&&Math.abs(p.x-boss.x)<45){boss.hp-=p.damage;hit=true;addParticles(boss.x+25,boss.y+30,'#7de6d9',12);if(boss.hp<=0)defeatBoss()}if(hit||p.life<=0||p.x<cam-80||p.x>cam+W+80)projectiles.splice(i,1)}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=dt;if(p.life<=0)particles.splice(i,1)}
cam=Math.max(0,Math.min(worldEnd-W,player.x-W*.36));
}
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function text(s,x,y,size=12,color='#f8e9c9',font='DM Mono',align='left'){ctx.fillStyle=color;ctx.font=`${size}px '${font}', monospace`;ctx.textAlign=align;ctx.fillText(s,x,y)}
function drawBackground(){let interior=cam>2060;let grad=ctx.createLinearGradient(0,0,0,H);if(interior){grad.addColorStop(0,'#241d31');grad.addColorStop(.63,'#463044');grad.addColorStop(1,'#9b6347')}else{grad.addColorStop(0,'#563954');grad.addColorStop(.5,'#c27b60');grad.addColorStop(1,'#f0bd76')}ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
if(!interior){let sunX=750-cam*.08;ctx.fillStyle='#ffdc8c25';ctx.beginPath();ctx.arc(sunX,130,80,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd994';ctx.beginPath();ctx.arc(sunX,130,34,0,Math.PI*2);ctx.fill();for(let i=0;i<5;i++){let x=((i*270-cam*.17)%1250+1250)%1250-100;let y=260+(i%3)*20;ctx.fillStyle=['#a86d70','#9a626d','#88566a'][i%3];ctx.beginPath();ctx.moveTo(x-180,390);ctx.lineTo(x+65,y);ctx.lineTo(x+290,390);ctx.fill()}drawPyramid(560-cam*.24,390,260,170,'#8e5c54');drawPyramid(1170-cam*.24,385,175,125,'#9b6655');}else{for(let i=0;i<8;i++){let x=((i*170-cam*.28)%1100+1100)%1100;ctx.fillStyle=i%2?'#30253b':'#39283d';ctx.fillRect(x,80,50,360);for(let y=125;y<400;y+=75)rect(x+5,y,40,4,'#67404a');}for(let i=0;i<6;i++){let x=((i*225-cam*.2)%1150+1150)%1150;ctx.fillStyle='#e7a94c18';ctx.beginPath();ctx.arc(x,215,5,0,Math.PI*2);ctx.fill()}}}
function drawPyramid(x,y,w,h,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x-w/2,y);ctx.lineTo(x+w/2,y);ctx.closePath();ctx.fill();ctx.fillStyle='#e4aa7040';ctx.beginPath();ctx.moveTo(x,y-h);ctx.lineTo(x,y);ctx.lineTo(x+w/2,y);ctx.closePath();ctx.fill();for(let r=1;r<5;r++)rect(x-w*.4,y-h+r*h*.19,w*.8,2,'#432d3b30')}
function drawGround(){let floor=floorAt(player.x);rect(0,floor,W,H-floor,'#815047');rect(0,floor,W,8,'#e1a25b');for(let x=-((cam|0)%48);x<W;x+=48){rect(x,floor+8,46,8,'#9b5b4b');rect(x+12,floor+20,26,4,'#70443f');rect(x+3,floor+35,4,4,'#c07650')}if(cam<2180){ctx.fillStyle='#d5a064';for(let i=0;i<28;i++){let x=((i*71-cam)%1000+1000)%1000;rect(x,440+(i*19%80),2,2,'#efc581')}}}
function drawPlatforms(){for(const p of platforms){let x=p.x-cam;if(x<-200||x>W+100)continue;rect(x,p.y,p.w,10,'#e0a362');rect(x,p.y+10,p.w,13,'#9b5d4c');for(let q=0;q<p.w;q+=27)rect(x+q,p.y+10,2,13,'#704448')}}
function drawChest(c){let x=c.x-cam,f=floorAt(c.x);if(x<-50||x>W+50)return;if(c.opened){rect(x,f-21,32,12,'#69423d');rect(x,f-27,32,7,'#a16c49');return}rect(x,f-29,32,25,'#92543e');rect(x,f-34,32,9,'#d39b51');rect(x+13,f-30,5,23,'#f0ce7d');rect(x+2,f-17,28,3,'#d89b53');rect(x+12,f-22,7,7,'#ffe19a');if(Math.sin(tick*3+c.x)*4>1)rect(x+14,f-45,4,5,'#ffe08c')}
function drawEnemy(e){if(!e.alive)return;let x=e.x-cam,y=e.y;if(x<-60||x>W+60)return;ctx.save();if(e.dir<0){ctx.translate(x*2+e.w,0);ctx.scale(-1,1);x=e.x-cam}if(e.type==='mummy'){rect(x+5,y+5,18,31,'#c8b07c');rect(x+7,y,14,13,'#e4d3a4');rect(x+5,y+16,20,4,'#a88761');rect(x+7,y+24,18,4,'#a88761');rect(x+9,y+8,3,3,'#ffb65c');rect(x+18,y+8,3,3,'#ffb65c');rect(x+7,y+36,7,4,'#49333a');rect(x+19,y+36,7,4,'#49333a');}else{rect(x+2,y+12,31,13,'#ca754c');rect(x+7,y+4,18,15,'#bc6848');rect(x+8,y+7,4,3,'#ffd174');rect(x+21,y+7,4,3,'#ffd174');rect(x+1,y+23,9,5,'#743d3c');rect(x+25,y+23,9,5,'#743d3c')}ctx.restore();if(e.hp<e.max){rect(e.x-cam,y-8,e.w,3,'#412c34');rect(e.x-cam,y-8,e.w*e.hp/e.max,3,'#df7758')}}
function drawPlayer(){let x=player.x-cam,y=player.y;ctx.save();if(player.invuln>0&&Math.floor(tick*15)%2)ctx.globalAlpha=.35;let walk=Math.abs(player.vx)>0?Math.sin(player.anim)*3:0;rect(x+5,y+15,20,20,'#263543');rect(x+6,y+34,8,8+walk,'#bf8053');rect(x+17,y+34,8,8-walk,'#bf8053');rect(x+5,y+12,21,5,'#d0a14d');rect(x+7,y+1,17,15,'#a96543');rect(x+7,y+4,16,5,'#f1c48b');rect(x+6,y-2,20,6,'#e3bd5c');rect(x+12,y-8,9,8,'#d3a54c');rect(x+10,y+7,3,3,'#2b2229');rect(x+20,y+7,3,3,'#2b2229');rect(x+8,y+18,5,15,'#e3bd5c');let sx=x+(player.face===1?26:-5);rect(sx,y+13,4,27,'#f2d57c');rect(sx+1,y+12,3,20,'#fff0ad');rect(sx-2,y+13,8,3,'#9d573c');if(player.attackCd>.18){ctx.fillStyle='#ffe8a0aa';ctx.beginPath();ctx.arc(x+14+player.face*37,y+22,22,-1.15,1.15);ctx.fill()}ctx.restore()}
function drawBoss(){if(!boss||!boss.alive)return;let x=boss.x-cam,y=boss.y;rect(x+9,y+18,40,48,'#292236');rect(x+6,y+8,46,23,'#402b3b');rect(x+9,y+2,9,16,'#d49c55');rect(x+42,y+2,9,16,'#d49c55');rect(x+17,y+14,7,5,'#ffbb5b');rect(x+37,y+14,7,5,'#ffbb5b');rect(x+13,y+32,9,35,'#c29b59');rect(x+37,y+32,9,35,'#c29b59');rect(x+2,y+36,9,9,'#d0a65e');rect(x+49,y+36,9,9,'#d0a65e');rect(x+18,y+25,25,7,'#9d5548');rect(300,93,360,10,'#432c38');rect(300,93,360*boss.hp/boss.max,10,'#db7256');text('ANUBIS · PYRAMID WARDEN',480,85,11,'#ffdc9b','DM Mono','center')}
function drawProjectiles(){for(const p of projectiles){ctx.fillStyle='#9cf6dd';ctx.shadowColor='#65e8d0';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(p.x-cam,p.y,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;rect(p.x-cam-3,p.y-3,6,6,'#fff6ca')}}
function drawHUD(){rect(18,16,255,86,'#171321dc');rect(18,16,3,86,'#e2af62');text('PRINCE KHAEMWASET',32,35,11,'#f3d590');text(`${player.weapon}  ·  LV ${player.level}`,32,52,10,'#e6c6a0');text('HP',32,70,9,'#f3a18a');rect(57,62,165,10,'#4e303a');rect(57,62,165*player.hp/player.maxHp,10,'#da705e');text(`${Math.ceil(player.hp)}/${player.maxHp}`,229,71,9,'#ffe3bd','DM Mono','right');text('MP',32,88,9,'#86d8d1');rect(57,80,165,8,'#293943');rect(57,80,165*player.mp/player.maxMp,8,'#64bfb6');rect(18,108,255,7,'#392b39');rect(18,108,255*player.xp/player.next,7,'#e4bb67');text(`${player.xp} / ${player.next} XP`,274,114,8,'#f1d8a1','DM Mono','right');
rect(750,17,192,50,'#171321c9');text('EXPEDITION',766,36,9,'#d4ad78');const prog=Math.min(1,player.x/4400);rect(766,46,158,5,'#45343b');rect(766,46,158*prog,5,'#e4b85e');text(player.x<2100?'THE DESERT':'THE SUNKEN PYRAMID',766,61,9,'#eed5ad');let objective=player.x<650?'Find the pyramid entrance':player.x<4320?'Defeat undead · find relics':boss?.alive?'Defeat Anubis':gem&&!gem.got?'Claim the Sun Gem':'Reach the Sun Gem';rect(690,485,250,34,'#171321c9');text('✦  '+objective,704,507,10,'#f6d79e');text('⚔ '+player.str,785,89,10,'#e8c994');text('✦ '+player.magic,842,89,10,'#9be1d8');text('SPEED '+player.speed.toFixed(1),900,89,9,'#e8c994','DM Mono','right');}
function drawTitle(){ctx.fillStyle='rgba(17,14,23,.32)';ctx.fillRect(0,0,W,H);drawPyramid(475,480,500,310,'#714a4d');drawPyramid(700,480,300,210,'#8e5b50');ctx.fillStyle='#171321aa';ctx.fillRect(0,0,W,H);text('A SUNKEN PYRAMID ADVENTURE',480,91,12,'#f2c56b','DM Mono','center');text('PRINCE OF THE',480,164,34,'#f8e8c6','Marcellus','center');text('SUNKEN PYRAMID',480,207,42,'#eeb75f','Marcellus','center');rect(388,229,184,2,'#c78c53');text('The Sun Gem has been stolen from the royal tomb.',480,267,13,'#f0d8bb','DM Mono','center');text('Descend into the sands. Break the curse. Reclaim your birthright.',480,290,11,'#c8b5a9','DM Mono','center');rect(362,343,236,48,'#b67b43');rect(365,346,230,42,'#dba857');text('BEGIN YOUR QUEST',480,374,13,'#241d2a','DM Mono','center');text('MOVE  A / D  ·  JUMP  SPACE  ·  STRIKE  J  ·  MAGIC  K',480,430,10,'#f3d6a0','DM Mono','center');text('INTERACT  E    •    LEVEL UP TO IMPROVE YOUR ATTRIBUTES',480,451,10,'#cfbda8','DM Mono','center');text('A pixel-art action adventure',480,506,9,'#967f83','DM Mono','center')}
function drawUpgrade(){rect(0,0,W,H,'#100d17bb');rect(270,104,420,336,'#251d2b');rect(270,104,420,3,'#e9b957');text('A NEW CHAPTER',480,147,12,'#efc56f','DM Mono','center');text('CHOOSE YOUR UPGRADE',480,179,21,'#f8e9cc','Marcellus','center');const opts=[['1','MIGHT','+5 strength · stronger blade strikes'],['2','VITALITY','+25 max health · restore 35 HP'],['3','ARCANA','+7 magic · +15 max mana'],['4','SWIFTNESS','Move faster across the sands']];opts.forEach((o,i)=>{let y=204+i*51;rect(299,y,362,43,'#332637');rect(309,y+8,27,27,'#b17b49');text(o[0],322.5,y+27,13,'#fff0ca','DM Mono','center');text(o[1],348,y+17,11,'#eac276');text(o[2],348,y+33,9,'#c8b8b2')});text('PRESS 1–4 TO CHOOSE',480,423,9,'#9c888d','DM Mono','center')}
function drawEnd(win){rect(0,0,W,H,'#130f1bcc');text(win?'THE SUN GEM IS RESTORED':'YOUR LIGHT FADES',480,185,15,'#f2c56b','DM Mono','center');text(win?'A KINGDOM SAVED':'THE PYRAMID CLAIMS ANOTHER',480,244,34,'#f7e5c3','Marcellus','center');text(win?'Khaemwaset returns to Thebes, the Sun Gem blazing once more.':'Rise again, prince. The sands remember the brave.',480,286,12,'#d4c0ac','DM Mono','center');text(`LEVEL ${player.level}   ·   ${opened} TREASURES FOUND   ·   ${player.weapon}`,480,342,11,'#e3bd79','DM Mono','center');rect(377,389,206,43,'#d5a151');text('PLAY AGAIN  ·  E',480,416,12,'#211924','DM Mono','center')}
function draw(){ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);drawBackground();drawGround();drawPlatforms();chests.forEach(drawChest);enemies.forEach(drawEnemy);drawProjectiles();drawPlayer();drawBoss();if(gem&&!gem.got){let x=gem.x-cam,y=gem.y+Math.sin(tick*4)*4;ctx.shadowColor='#ffe47e';ctx.shadowBlur=20;ctx.fillStyle='#ffe58a';ctx.beginPath();ctx.moveTo(x+12,y);ctx.lineTo(x+23,y+12);ctx.lineTo(x+12,y+28);ctx.lineTo(x+2,y+12);ctx.closePath();ctx.fill();ctx.shadowBlur=0}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);rect(p.x-cam,p.y,p.size,p.size,p.color)}ctx.globalAlpha=1;if(gameState==='title')drawTitle();else if(gameState==='dead')drawEnd(false);else if(gameState==='won')drawEnd(true);else drawHUD();if(upgradeOpen&&gameState==='playing')drawUpgrade();ctx.restore()}
function frame(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame)}
const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'up',w:'w', ' ':'jump',j:'attack',k:'magic',e:'interact',Enter:'interact'};
window.addEventListener('keydown',e=>{let k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(k))e.preventDefault();if(upgradeOpen&&'1234'.includes(k)){upgrade(+k);return}let action=map[k]||map[k.toLowerCase()];if(action){keys[action]=true;if(action==='attack')attack();if(action==='magic')castMagic();if(action==='interact'){if(gameState==='title')startGame();else interact()}}});window.addEventListener('keyup',e=>{let action=map[e.key]||map[e.key.toLowerCase()];if(action)keys[action]=false});
document.querySelectorAll('.touchbtn').forEach(b=>{let a=b.dataset.key;const down=e=>{e.preventDefault();if(a==='attack')attack();else if(a==='magic')castMagic();else if(a==='interact')interact();else keys[a]=true};const up=e=>{e.preventDefault();keys[a]=false};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up)});
canvas.addEventListener('pointerdown',e=>{if(gameState==='title')startGame();else if(gameState==='dead'||gameState==='won')resetGame();else if(upgradeOpen){const r=canvas.getBoundingClientRect(),y=(e.clientY-r.top)*H/r.height;const choice=Math.floor((y-204)/51)+1;if(choice>=1&&choice<=4)upgrade(choice)}});
requestAnimationFrame(frame);
})();
</script></body></html>
